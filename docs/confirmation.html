<body>
    <div class="site">

        <main class="hero">
            <h1>You're signed up</h1>

    <script>
        // Show plan if passed via ?plan=...
        (function () {
            var params = new URLSearchParams(window.location.search);
            var p = params.get('plan');
            if (p) {
                var el = document.getElementById('plan');
                if (el) el.textContent = p;
            }
        })();
    </script>
