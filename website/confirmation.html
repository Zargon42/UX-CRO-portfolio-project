<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Thank you — Conversion Test</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<div class="site">
		<header>
			<div class="brand"><a href="index.html">Acme CRO</a></div>
		</header>

		<main class="hero">
			<h1>You're signed up</h1>
			<p class="muted">Thanks for joining — your account has been created for the selected plan.</p>
			<p class="note">Plan: <span id="plan" class="selected-plan">Basic</span></p>
			<p class="muted">This page is the conversion endpoint in the demo funnel.</p>
			<p><a href="index.html" class="btn btn-ghost">Back to home</a></p>
		</main>
	</div>

	<script>
		// Show plan if passed via ?plan=...
		(function(){
			var params = new URLSearchParams(window.location.search);
			var p = params.get('plan');
			if(p){
				var el = document.getElementById('plan');
				if(el) el.textContent = p;
			}
		})();
	</script>
</body>
</html>
